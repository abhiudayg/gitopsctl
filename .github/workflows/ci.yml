name: Continuous Testing

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true

      - name: Go build
        run: |
          go build -v ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Go fmt (check)
        run: |
          test -z "$(gofmt -l .)"

      - name: Go test
        run: |
          go test -race -coverprofile=coverage.txt -covermode=atomic ./...
          go tool cover -func=coverage.txt

      - name: Check Coverage
        run: |
          # Parse coverage total from the func output
          total_coverage=$(go tool cover -func=coverage.txt | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $total_coverage%"
          # Check if coverage is below 80% (using awk for float comparison)
          if [ "$(echo "$total_coverage < 80.0" | bc)" -eq 1 ]; then
            echo "Error: Coverage $total_coverage% is below the required 80.0% threshold."
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.txt
          fail_ci_if_error: false

      - name: Go vet
        run: |
          go vet ./...

      - name: CLI smoke
        run: |
          chmod +x scripts/cli-smoke.sh
          scripts/cli-smoke.sh
