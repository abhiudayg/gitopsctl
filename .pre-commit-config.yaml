default_stages: [pre-push]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0

    hooks:
      - id: golangci-lint
        args: [--timeout=5m]
        pass_filenames: false

  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: go fmt ./...
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        files: (go.mod|go.sum)$
        pass_filenames: false

      - id: govulncheck
        name: govulncheck
        entry: bash -c 'go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...'
        language: system
        pass_filenames: false

      - id: go-test-coverage
        name: go test coverage
        entry: bash -c 'go clean -testcache && go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | grep total | awk "{print \$3}" | sed "s/%//" | awk "{if (\$1 < 80.0) exit 1}"'
        language: system
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false

      - id: cli-smoke
        name: cli smoke
        entry: bash -c 'chmod +x scripts/cli-smoke.sh && ./scripts/cli-smoke.sh'
        language: system
        pass_filenames: false
